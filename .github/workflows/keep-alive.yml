name: Keep backend alive

# O free tier do Render hiberna o backend apos ~15 min sem requisicoes; a proxima
# requisicao real do usuario entao fica presa esperando o container acordar
# (ate ~1 min). Esse ping periodico mantem o backend sempre desperto.
#
# GitHub so garante o cron "aproximadamente" nesse intervalo (pode atrasar em
# picos de carga da plataforma) e desativa workflows agendados automaticamente
# apos 60 dias sem nenhuma atividade no repositorio - se o sistema voltar a
# ficar lento do nada, confira em Actions se esse workflow ainda esta ativo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -sf --max-time 90 https://sys-dezesseis-backend.onrender.com/api/health
